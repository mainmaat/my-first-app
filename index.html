<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skybound Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><div><small>NEON DISTRICT // RUNNER</small><h1>NEON RUNNER</h1></div><div class="stats"><span>DATA <b id="score">0</b></span><span>INTEGRITY <b id="lives">3</b></span></div></header>
    <div class="frame"><canvas id="game" width="960" height="540"></canvas><div id="message" hidden></div></div>
    <div class="help"><span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> MOVE　<kbd>Space</kbd> JUMP</span><button id="restart">REBOOT RUN</button></div>
    <div class="touch"><button data-key="left">◀</button><button data-key="jump">▲</button><button data-key="right">▶</button></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
